name: Build VIBEZ iOS App (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Generate Xcode Project & Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Vibez.xcodeproj
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS App for Device (Unsigned Archive)
        working-directory: ios
        run: |
          xcodebuild clean build \
            -project Vibez.xcodeproj \
            -scheme Vibez \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned .ipa Artifact
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Vibez.app Payload/
          zip -r Vibez-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS .ipa & .xcodeproj Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vibez-iOS-Build
          path: |
            ios/Vibez-unsigned.ipa
            ios/Vibez.xcodeproj
