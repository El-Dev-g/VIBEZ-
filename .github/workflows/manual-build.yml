name: Manual Build Pipeline

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android Application'
        required: true
        type: boolean
        default: true
      android_build_type:
        description: 'Android Build Type'
        required: true
        type: choice
        options:
          - 'debug_apk'
          - 'release_apk'
          - 'release_bundle_aab'
        default: 'debug_apk'
      build_server:
        description: 'Build Express Server Backend (TypeScript)'
        required: true
        type: boolean
        default: false
      build_admin:
        description: 'Build Next.js Admin Dashboard'
        required: true
        type: boolean
        default: false
      build_landingpage:
        description: 'Build Next.js Landing Page Web'
        required: true
        type: boolean
        default: false

jobs:
  build-android:
    name: Build Android App
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Prepare Firebase Config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Injecting google-services.json from GitHub Secrets (GOOGLE_SERVICES_JSON)..."
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "google-services.json is missing on checkout and no secret provided. Generating fallback placeholder..."
            PACKAGE_NAME=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "com.aistudio.whatsappclone.app")
            echo "Detected application ID: $PACKAGE_NAME"
            echo '{
              "project_info": {
                "project_number": "123456789",
                "project_id": "mock-project-id",
                "storage_bucket": "mock-bucket.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789:android:123456789",
                    "android_client_info": {
                      "package_name": "'"$PACKAGE_NAME"'"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "mock_api_key_value"
                    }
                  ],
                  "services": {}
                }
              ],
              "configuration_version": "1"
            }' > app/google-services.json
          else
            echo "google-services.json already exists in workspace!"
          fi

      - name: Prepare Keystore (Release Mode)
        if: ${{ inputs.android_build_type != 'debug_apk' }}
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
            echo "USING_CUSTOM_SECRETS=true" >> $GITHUB_ENV
          else
            echo "No custom keystore secret provided. Creating a temporary keystore for building a signed package..."
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Vibez, O=AI Studio, C=US" -storepass "temporarypassword" -keypass "temporarypassword"
            echo "TEMP_STORE_PASSWORD=temporarypassword" >> $GITHUB_ENV
            echo "TEMP_KEY_PASSWORD=temporarypassword" >> $GITHUB_ENV
            echo "TEMP_KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "USING_CUSTOM_SECRETS=false" >> $GITHUB_ENV
          fi

      - name: Build Android Package (Debug APK)
        if: ${{ inputs.android_build_type == 'debug_apk' }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Android Package (Release APK)
        if: ${{ inputs.android_build_type == 'release_apk' }}
        env:
          KEYSTORE_PATH: "my-upload-key.jks"
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.RELEASE_KEY_PASSWORD || env.TEMP_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || env.TEMP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || env.TEMP_KEY_ALIAS || 'vibez-key' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build Android Package (Release AAB Bundle)
        if: ${{ inputs.android_build_type == 'release_bundle_aab' }}
        env:
          KEYSTORE_PATH: "my-upload-key.jks"
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.RELEASE_KEY_PASSWORD || env.TEMP_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || env.TEMP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || env.TEMP_KEY_ALIAS || 'vibez-key' }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload Debug APK Artifact
        if: ${{ inputs.android_build_type == 'debug_apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: vibez-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release APK Artifact
        if: ${{ inputs.android_build_type == 'release_apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: vibez-android-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release AAB Bundle Artifact
        if: ${{ inputs.android_build_type == 'release_bundle_aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: vibez-android-release-bundle-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  build-server:
    name: Build Express Server
    if: ${{ inputs.build_server }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Build Server
        working-directory: ./server
        run: npm run build

      - name: Upload Server Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-server-dist
          path: |
            server/dist
            server/package.json
            server/package-lock.json
            server/prisma
          if-no-files-found: error
          retention-days: 7

  build-admin:
    name: Build Admin Dashboard
    if: ${{ inputs.build_admin }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin Dependencies
        working-directory: ./admin
        run: npm ci

      - name: Build Next.js Dashboard
        working-directory: ./admin
        run: npm run build

      - name: Upload Admin Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-admin-web-build
          path: |
            admin/.next
            admin/public
            admin/package.json
            admin/package-lock.json
          if-no-files-found: error
          retention-days: 7

  build-landingpage:
    name: Build Landing Page Web
    if: ${{ inputs.build_landingpage }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landingpage/package-lock.json

      - name: Install Landing Page Dependencies
        working-directory: ./landingpage
        run: npm ci

      - name: Build Landing Page
        working-directory: ./landingpage
        run: npm run build

      - name: Upload Landing Page Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-landingpage-web-build
          path: |
            landingpage/.next
            landingpage/public
            landingpage/package.json
            landingpage/package-lock.json
          if-no-files-found: error
          retention-days: 7
