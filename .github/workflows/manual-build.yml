name: Manual Build Pipeline

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android Application (APK)'
        required: true
        type: boolean
        default: true
      build_server:
        description: 'Build Express Server Backend (TypeScript)'
        required: true
        type: boolean
        default: false
      build_admin:
        description: 'Build Next.js Admin Dashboard'
        required: true
        type: boolean
        default: false

jobs:
  build-android:
    name: Build Android App
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  build-server:
    name: Build Express Server
    if: ${{ inputs.build_server }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Build Server
        working-directory: ./server
        run: npm run build

  build-admin:
    name: Build Admin Dashboard
    if: ${{ inputs.build_admin }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin Dependencies
        working-directory: ./admin
        run: npm ci

      - name: Build Next.js Dashboard
        working-directory: ./admin
        run: npm run build
