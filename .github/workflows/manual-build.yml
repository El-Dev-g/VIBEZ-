name: Manual Build & Release Pipeline

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android Application'
        required: true
        type: boolean
        default: true
      android_build_type:
        description: 'Android Build Type'
        required: true
        type: choice
        options:
          - 'debug_apk'
          - 'release_apk'
          - 'release_bundle_aab'
        default: 'release_apk'
      create_github_release:
        description: 'Automatically create GitHub Release & attach binaries'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (leave empty for auto tag e.g. v1.0.0-build-X)'
        required: false
        type: string
        default: ''
      build_server:
        description: 'Build Express Server Backend (TypeScript)'
        required: true
        type: boolean
        default: false
      build_admin:
        description: 'Build Next.js Admin Dashboard'
        required: true
        type: boolean
        default: false
      build_landingpage:
        description: 'Build Next.js Landing Page Web'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    name: Build Android App
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Prepare Firebase Config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Injecting google-services.json from GitHub Secrets (GOOGLE_SERVICES_JSON)..."
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "google-services.json found in repository checkout."
          else
            echo "::error::CRITICAL: google-services.json is missing and GOOGLE_SERVICES_JSON secret was not provided. Build failed."
            exit 1
          fi

      - name: Prepare Keystore (Release Mode)
        if: ${{ inputs.android_build_type != 'debug_apk' }}
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::CRITICAL: RELEASE_KEYSTORE_BASE64 secret is missing! Release signing cannot proceed without a valid keystore. Build failed."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ] && [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "::error::CRITICAL: Keystore passwords (RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD) are missing in GitHub Secrets! Build failed."
            exit 1
          fi
          echo "Decoding release keystore from secrets..."
          echo -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
          if [ ! -s "my-upload-key.jks" ]; then
            echo "::error::CRITICAL: Decoded keystore file is empty or corrupted! Build failed."
            exit 1
          fi
          echo "Keystore verified successfully."

      - name: Build Android Package (Debug APK)
        if: ${{ inputs.android_build_type == 'debug_apk' }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Android Package (Release APK)
        if: ${{ inputs.android_build_type == 'release_apk' }}
        env:
          KEYSTORE_PATH: "my-upload-key.jks"
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'vibez-key' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build Android Package (Release AAB Bundle)
        if: ${{ inputs.android_build_type == 'release_bundle_aab' }}
        env:
          KEYSTORE_PATH: "my-upload-key.jks"
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'vibez-key' }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload Debug APK Artifact
        if: ${{ inputs.android_build_type == 'debug_apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: vibez-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release APK Artifact
        if: ${{ inputs.android_build_type == 'release_apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: vibez-android-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release AAB Bundle Artifact
        if: ${{ inputs.android_build_type == 'release_bundle_aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: vibez-android-release-bundle-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Determine Release Tag
        if: ${{ inputs.create_github_release }}
        id: release_meta
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          else
            TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Automatically Publish GitHub Release
        if: ${{ inputs.create_github_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: "Vibez Release ${{ steps.release_meta.outputs.tag_name }}"
          draft: false
          prerelease: ${{ inputs.android_build_type == 'debug_apk' }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-server:
    name: Build Express Server
    if: ${{ inputs.build_server }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Build Server
        working-directory: ./server
        run: npm run build

      - name: Upload Server Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-server-dist
          path: |
            server/dist
            server/package.json
            server/package-lock.json
            server/prisma
          if-no-files-found: error
          retention-days: 7

  build-admin:
    name: Build Admin Dashboard
    if: ${{ inputs.build_admin }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin Dependencies
        working-directory: ./admin
        run: npm ci

      - name: Build Next.js Dashboard
        working-directory: ./admin
        run: npm run build

      - name: Upload Admin Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-admin-web-build
          path: |
            admin/.next
            admin/public
            admin/package.json
            admin/package-lock.json
          if-no-files-found: error
          retention-days: 7

  build-landingpage:
    name: Build Landing Page Web
    if: ${{ inputs.build_landingpage }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landingpage/package-lock.json

      - name: Install Landing Page Dependencies
        working-directory: ./landingpage
        run: npm ci

      - name: Build Landing Page
        working-directory: ./landingpage
        run: npm run build

      - name: Upload Landing Page Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-landingpage-web-build
          path: |
            landingpage/.next
            landingpage/public
            landingpage/package.json
            landingpage/package-lock.json
          if-no-files-found: error
          retention-days: 7
