name: Manual Build & Release Pipeline

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android Application'
        required: true
        type: boolean
        default: true
      android_build_type:
        description: 'Android Build Type'
        required: true
        type: choice
        options:
          - 'debug_apk'
          - 'release_apk'
          - 'release_bundle_aab'
        default: 'release_apk'
      backend_url:
        description: 'Backend API URL (e.g. https://vibez-server.onrender.com/)'
        required: false
        type: string
        default: 'https://vibez-n5h1.onrender.com'
      google_web_client_id:
        description: 'Google OAuth Web Client ID for Sign-In'
        required: false
        type: string
        default: 'your_google_web_client_id.apps.googleusercontent.com'
      create_github_release:
        description: 'Automatically create GitHub Release & attach binaries'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (leave empty for auto tag e.g. v1.0.0-build-X)'
        required: false
        type: string
        default: ''
      build_server:
        description: 'Build Express Server Backend (TypeScript)'
        required: true
        type: boolean
        default: false
      build_admin:
        description: 'Build Next.js Admin Dashboard'
        required: true
        type: boolean
        default: false
      build_landingpage:
        description: 'Build Next.js Landing Page Web'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android App
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Prepare Firebase Config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Injecting google-services.json from GitHub Secrets (GOOGLE_SERVICES_JSON)..."
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "google-services.json found in repository checkout."
          else
            echo "::error::CRITICAL: google-services.json is missing and GOOGLE_SERVICES_JSON secret was not provided. Build failed."
            exit 1
          fi

      - name: Inject Environment Variables (.env)
        env:
          BACKEND_URL_SECRET: ${{ secrets.BACKEND_URL }}
          GOOGLE_WEB_CLIENT_ID_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          # Determine BACKEND_URL
          if [ -n "$BACKEND_URL_SECRET" ]; then
            RESOLVED_BACKEND_URL="$BACKEND_URL_SECRET"
            echo "Using BACKEND_URL from GitHub Secrets."
          elif [ -n "${{ inputs.backend_url }}" ]; then
            RESOLVED_BACKEND_URL="${{ inputs.backend_url }}"
            echo "Using BACKEND_URL from workflow input."
          else
            RESOLVED_BACKEND_URL="https://vibez-n5h1.onrender.com"
            echo "Using fallback default BACKEND_URL."
          fi

          # Determine GOOGLE_WEB_CLIENT_ID
          if [ -n "$GOOGLE_WEB_CLIENT_ID_SECRET" ]; then
            RESOLVED_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID_SECRET"
            echo "Using GOOGLE_WEB_CLIENT_ID from GitHub Secrets."
          elif [ -n "${{ inputs.google_web_client_id }}" ]; then
            RESOLVED_CLIENT_ID="${{ inputs.google_web_client_id }}"
            echo "Using GOOGLE_WEB_CLIENT_ID from workflow input."
          else
            RESOLVED_CLIENT_ID="your_google_web_client_id.apps.googleusercontent.com"
            echo "Using fallback default GOOGLE_WEB_CLIENT_ID."
          fi

          # Create .env file for Secrets Gradle Plugin to compile into BuildConfig
          echo "Writing to .env file..."
          echo "BACKEND_URL=\"$RESOLVED_BACKEND_URL\"" > .env
          echo "GOOGLE_WEB_CLIENT_ID=\"$RESOLVED_CLIENT_ID\"" >> .env
          
          echo "----------------------------------------"
          echo "Current .env configuration values:"
          cat .env | sed 's/=[^=]*/=******/'
          echo "----------------------------------------"

      - name: Prepare Keystore (Release Mode)
        if: ${{ inputs.android_build_type != 'debug_apk' }}
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::CRITICAL: RELEASE_KEYSTORE_BASE64 secret is missing! Release signing cannot proceed without a valid keystore. Build failed."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ]; then
            echo "::error::CRITICAL: RELEASE_STORE_PASSWORD secret is missing! Build failed."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "::error::CRITICAL: RELEASE_KEY_PASSWORD secret is missing! Build failed."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ]; then
            echo "::error::CRITICAL: RELEASE_KEY_ALIAS secret is missing! Build failed."
            exit 1
          fi
          
          echo "Decoding release keystore from secrets..."
          echo -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
          if [ ! -s "my-upload-key.jks" ]; then
            echo "::error::CRITICAL: Decoded keystore file is empty or corrupted! Build failed."
            exit 1
          fi
          echo "Keystore verified successfully."

      - name: Build Android Package (Debug APK)
        if: ${{ inputs.android_build_type == 'debug_apk' }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Android Package (Release APK)
        if: ${{ inputs.android_build_type == 'release_apk' }}
        env:
          KEYSTORE_PATH: "my-upload-key.jks"
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build Android Package (Release AAB Bundle)
        if: ${{ inputs.android_build_type == 'release_bundle_aab' }}
        env:
          KEYSTORE_PATH: "my-upload-key.jks"
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Determine and Rename Release Asset File
        id: release_file
        run: |
          case "${{ inputs.android_build_type }}" in
            debug_apk)
              SRC="app/build/outputs/apk/debug/app-debug.apk"
              DEST="VIBEZ-debug.apk"
              BUILD_NAME="Debug APK"
              ;;
            release_apk)
              SRC="app/build/outputs/apk/release/app-release.apk"
              DEST="VIBEZ-release.apk"
              BUILD_NAME="Release APK"
              ;;
            release_bundle_aab)
              SRC="app/build/outputs/bundle/release/app-release.aab"
              DEST="VIBEZ-release.aab"
              BUILD_NAME="Release AAB"
              ;;
            *)
              echo "::error::Unknown android build type: ${{ inputs.android_build_type }}"
              exit 1
              ;;
          esac
          
          if [ ! -f "$SRC" ]; then
            echo "::error::Source file not found at $SRC"
            exit 1
          fi
          
          cp "$SRC" "$DEST"
          
          echo "file=$DEST" >> "$GITHUB_OUTPUT"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify Release Asset Exists
        run: |
          test -f "${{ steps.release_file.outputs.file }}"

      - name: Upload Debug APK Artifact
        if: ${{ inputs.android_build_type == 'debug_apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: vibez-android-debug-apk
          path: VIBEZ-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release APK Artifact
        if: ${{ inputs.android_build_type == 'release_apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: vibez-android-release-apk
          path: VIBEZ-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release AAB Bundle Artifact
        if: ${{ inputs.android_build_type == 'release_bundle_aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: vibez-android-release-bundle-aab
          path: VIBEZ-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Determine Release Tag
        if: ${{ inputs.create_github_release }}
        id: release_meta
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          else
            TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Automatically Publish GitHub Release
        if: ${{ inputs.create_github_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: "VIBEZ ${{ steps.release_meta.outputs.tag_name }} — ${{ steps.release_file.outputs.build_name }}"
          draft: false
          prerelease: ${{ inputs.android_build_type == 'debug_apk' }}
          generate_release_notes: true
          files: ${{ steps.release_file.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build-server:
    name: Build Express Server
    if: ${{ inputs.build_server }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Build Server
        working-directory: ./server
        run: npm run build

      - name: Upload Server Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-server-dist
          path: |
            server/dist
            server/package.json
            server/package-lock.json
            server/prisma
          if-no-files-found: error
          retention-days: 7

  build-admin:
    name: Build Admin Dashboard
    if: ${{ inputs.build_admin }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin Dependencies
        working-directory: ./admin
        run: npm ci

      - name: Build Next.js Dashboard
        working-directory: ./admin
        run: npm run build

      - name: Upload Admin Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-admin-web-build
          path: |
            admin/.next
            admin/public
            admin/package.json
            admin/package-lock.json
          if-no-files-found: error
          retention-days: 7

  build-landingpage:
    name: Build Landing Page Web
    if: ${{ inputs.build_landingpage }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landingpage/package-lock.json

      - name: Install Landing Page Dependencies
        working-directory: ./landingpage
        run: npm ci

      - name: Build Landing Page
        working-directory: ./landingpage
        run: npm run build

      - name: Upload Landing Page Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibez-landingpage-web-build
          path: |
            landingpage/.next
            landingpage/public
            landingpage/package.json
            landingpage/package-lock.json
          if-no-files-found: error
          retention-days: 7
