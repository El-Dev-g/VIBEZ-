name: Vibez
options:
  bundleIdPrefix: com.aistudio.vibez
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: VibezApp/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.vibez.ios
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  Vibez:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VibezApp
    settings:
      base:
        INFOPLIST_FILE: VibezApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.vibez.ios
        PRODUCT_NAME: VIBEZ
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
